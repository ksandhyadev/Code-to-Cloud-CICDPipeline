name: Code-to-Cloud CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  # ============================================================================
  # STAGE 1: Continuous Integration (Build & Push Docker Image)
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 4. Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-cicd-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-cicd-app:${{ github.sha }}

  # ============================================================================
  # STAGE 2: Continuous Deployment (SSH to AWS EC2 & Container Deployment)
  # ============================================================================
  deploy:
    name: Deploy Container to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: 1. Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "========================================================="
            echo "Starting Deployment Pipeline on EC2 Instance..."
            echo "========================================================="

            # 1. Pull the newly published image from Docker Hub
            echo "[Step 1/4] Pulling latest Docker image..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/flask-cicd-app:latest

            # 2. Gracefully stop and remove existing container if running
            echo "[Step 2/4] Stopping and removing existing container..."
            if [ "$(docker ps -q -f name=flask-app)" ]; then
              docker stop flask-app
            fi
            if [ "$(docker ps -aq -f name=flask-app)" ]; then
              docker rm flask-app
            fi

            # 3. Spin up the new container with automated restart policy and port mapping
            echo "[Step 3/4] Launching new application container on port 5000..."
            docker run -d \
              --name flask-app \
              --restart always \
              -p 5000:5000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/flask-cicd-app:latest

            # 4. Clean up unused/dangling images to preserve EC2 disk storage
            echo "[Step 4/4] Pruning dangling Docker images..."
            docker image prune -f

            # 5. Verification: Check container status
            echo "========================================================="
            echo "Verifying running containers:"
            docker ps -f name=flask-app
            echo "========================================================="
            echo "Deployment Completed Successfully!"
